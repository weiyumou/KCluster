[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[project]
name = "kcluster"
version = "0.2.0.dev0"
description = "LLM-based knowledge component discovery and question generation for education"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yumou Wei", email = "yumouw@andrew.cmu.edu" }]
keywords = [
    "knowledge components",
    "educational data mining",
    "learning analytics",
    "question generation",
    "large language models",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
local = [
    "torch>=2.4",
    "lightning>=2.4",
    "transformers>=4.45",
    "accelerate>=1.0",
    "sentence-transformers>=3.0",
]
vertex = [
    "google-cloud-aiplatform[prediction]>=1.96,<2",
    "google-cloud-storage>=2.14",
]
gemini = ["google-genai>=1.0"]
datashop = ["beautifulsoup4>=4.12"]
# `kcluster fit` only. Leapfit is released on GitHub but not on PyPI, so this is
# a direct reference to the release's own wheel.
# 0.4.0 is the floor because `kcluster fit` summarizes paired cross-validation
# through `paired_scores`, and reads the per-fold `unseen_column_fraction` that
# 0.3.0's paired tables did not carry.
# Swap it for a plain `leapfit>=0.4` if it reaches PyPI: direct references
# cannot appear in metadata uploaded there, so this line changes first.
fit = ["leapfit @ https://github.com/weiyumou/LeapFit/releases/download/v0.4.0/leapfit-0.4.0-py3-none-any.whl"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", {include-group = "datasets"}, {include-group = "papers"}]
# Driver-only dependencies for the datasets/ workspaces; never shipped in the wheel
datasets = ["requests>=2.31", "pillow>=10", "beautifulsoup4>=4.12"]
# Analysis-notebook dependencies for the papers/ workspaces; never shipped in the wheel
papers = ["seaborn>=0.13", "statsmodels>=0.14"]

[project.scripts]
kcluster = "kcluster.cli:main"

[project.urls]
Repository = "https://github.com/weiyumou/KCluster"
"KCluster paper (EDM 2025)" = "https://doi.org/10.5281/zenodo.15870197"

[tool.uv.build-backend]
# Flat layout: the `kcluster` package sits at the repo root, not under src/
module-root = ""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The deploy scripts bootstrap sys.path before their imports by design
"deploy/vertex/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
